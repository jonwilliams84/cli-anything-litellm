[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "S", "B", "RUF"]
ignore = ["S101", "E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]   # fixtures deliberately contain fake keys / masked values

[tool.pytest.ini_options]
testpaths = ["tests"]
